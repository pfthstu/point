<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="点图 · 标注记忆：选点 → 标注 → 点亮；每箱词数 100/200/300/400；封箱后可选取训练；手机点图可滑动。">
<title>点图 · 标注记忆（融合原型 v0.4）</title>
<style>
/* =========================================================================
   点图 × 拆分标注 · 融合原型
   左/右图翼 = 点图；中央卡片 = word_trainer 拆分标注（视觉保持原样）；
   底部读数条 = 点图 dock（点击已点亮的点，显示那里存了谁）。
   ========================================================================= */
:root{
  --ink:#e9e1cf;
  --sub:#9aa3b5;
  --mute:#616b7e;
  --gold:#d9bc7d;
  --gold-bright:#f3e4b8;
  --line:rgba(217,188,125,.20);
  --teal:#5eead4;
  --indigo:#818cf8;
  --card-line:rgba(148,163,204,.16);
  --serif:"Georgia","Times New Roman","Songti SC","STSong","SimSun",serif;
  --sans:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ height:100%; }
body{
  margin:0; overflow:hidden;
  background:
    radial-gradient(1100px 800px at 50% 30%, #0d1524 0%, #070b13 55%, #04060b 100%);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(130% 95% at 50% 42%, transparent 55%, rgba(0,0,0,.42) 100%);
  z-index:1;
}
::selection{ background:rgba(217,188,125,.28); }
button{ font-family:inherit; }
button:focus-visible{ outline:1px solid rgba(243,228,190,.7); outline-offset:2px; }

.app{
  position:relative; z-index:2;
  height:100dvh;
  max-width:1500px; margin:0 auto;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  padding:0 clamp(12px, 2.4vw, 30px);
}

/* ---------------------------------------------------------------- topbar */
.topbar{
  display:flex; align-items:center; gap:18px;
  padding:clamp(12px,2vh,20px) 2px 8px;
}
.brand{ display:flex; align-items:baseline; gap:12px; min-width:0; }
.brand-title{
  margin:0; font-family:var(--serif); font-weight:600;
  font-size:clamp(19px,2.1vw,24px); letter-spacing:.24em; line-height:1;
  color:var(--ink); white-space:nowrap;
  text-shadow:0 0 26px rgba(217,188,125,.18);
}
.brand-title::before{
  content:"✦"; font-family:var(--sans); font-size:.42em; color:var(--gold);
  opacity:.7; margin-right:.55em; vertical-align:.28em; letter-spacing:0;
}
.brand-sub{
  font-size:11px; letter-spacing:.1em; color:var(--mute);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.annot-progress{ flex:1; max-width:430px; display:flex; align-items:center; gap:12px; margin-left:auto; }
.annot-progress .track{
  flex:1; height:5px; border-radius:999px; overflow:hidden;
  background:rgba(255,255,255,.07);
}
.annot-progress .track i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg, rgba(94,234,212,.9), rgba(129,140,248,.9));
  border-radius:999px; transition:width .3s ease;
}
.annot-count{ font-size:11.5px; letter-spacing:.05em; color:var(--sub); white-space:nowrap; }
.top-actions{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.box-pill{
  appearance:none; font-family:inherit; cursor:pointer;
  font-size:11.5px; letter-spacing:.06em; color:var(--gold);
  border:1px solid rgba(217,188,125,.28); background:rgba(217,188,125,.06);
  padding:7px 12px; border-radius:999px; white-space:nowrap;
  transition:border-color .16s, background .16s, color .16s;
}
.box-pill:hover{ border-color:rgba(217,188,125,.5); background:rgba(217,188,125,.1); }
.popover{
  position:fixed; z-index:55; width:min(268px,84vw); padding:16px;
  border-radius:16px; border:1px solid rgba(217,188,125,.22);
  background:linear-gradient(180deg,#0d1524,#0a101b);
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:popIn .16s ease-out;
}
@keyframes popIn{ from{ opacity:0; transform:translateY(-5px); } to{ opacity:1; transform:none; } }
.pop-title{ font-size:11px; letter-spacing:.18em; color:var(--mute); margin-bottom:10px; }
.cap-options{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.cap-opt{
  appearance:none; border:1px solid rgba(217,188,125,.18); background:rgba(255,255,255,.02);
  color:var(--sub); padding:10px 0; border-radius:10px; font-family:inherit;
  font-size:15px; cursor:pointer; transition:.14s;
}
.cap-opt:hover{ border-color:rgba(217,188,125,.42); color:var(--ink); }
.cap-opt.active{ border-color:rgba(217,188,125,.6); color:var(--gold); background:rgba(217,188,125,.12); font-weight:700; }
.pop-note{ margin:12px 0 0; font-size:10.5px; line-height:1.7; color:var(--mute); letter-spacing:.02em; }
.btn{
  appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.02);
  color:var(--sub); font-size:12px; letter-spacing:.08em; line-height:1;
  padding:9px 14px; border-radius:999px; cursor:pointer; user-select:none;
  white-space:nowrap; transition:.16s;
}
.btn:hover{ border-color:rgba(217,188,125,.42); color:var(--ink); background:rgba(217,188,125,.05); }

/* ---------------------------------------------------------------- stage / map */
.stage{ position:relative; min-height:0; min-width:0; }
.map-scroll{ position:absolute; inset:0; overflow:hidden; }
.map-scroll.scrollable{ overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; touch-action:pan-y; scrollbar-width:thin; scrollbar-color:rgba(217,188,125,.25) transparent; }
.map-scroll.scrollable::-webkit-scrollbar{ width:6px; }
.map-scroll.scrollable::-webkit-scrollbar-thumb{ background:rgba(217,188,125,.22); border-radius:3px; }
#map{ display:block; width:100%; height:100%; overflow:visible; }

.frame-outer{ fill:none; stroke:rgba(214,183,124,.18); stroke-width:1; }
.frame-inner{ fill:none; stroke:rgba(214,183,124,.06); stroke-width:1; }
.corner{ fill:rgba(214,183,124,.28); }
.decor{ pointer-events:none; }

.pt{ cursor:pointer; }
.pt .hit{ fill:transparent; }
.pt .ring{
  fill:none; stroke:rgba(198,207,225,.30); stroke-width:1.2;
  transition:stroke .16s ease, transform .16s ease;
  transform-box:fill-box; transform-origin:center;
}
.pt:hover .ring{ stroke:rgba(243,228,190,.9); transform:scale(1.35); }
.pt.target .ring{ stroke:rgba(243,228,190,.95); stroke-width:1.4; }
.pt .halo-select{
  fill:none; stroke:rgba(217,188,125,.6); stroke-width:1;
  stroke-dasharray:2 5; animation:spin 9s linear infinite;
  transform-box:fill-box; transform-origin:center;
}
.pt .glow{ fill:url(#litGlow); opacity:.9; }
.pt .core{ fill:#f2e3b6; }
.pt .spark{ fill:#fff9ea; }
.pt.lit:hover .glow{ opacity:1; }
.pt.lit:hover .core{ fill:#fff1c9; }
.pt.pin .core{ fill:#fff3cf; }
.pt .pin-ring{
  fill:none; stroke:rgba(217,188,125,.68); stroke-width:1;
  stroke-dasharray:1.5 3.5; animation:spin 14s linear infinite;
  transform-box:fill-box; transform-origin:center;
}
.pt.anim .core{ animation:igniteCore .46s cubic-bezier(.2,.8,.3,1) both; transform-box:fill-box; transform-origin:center; }
.pt.anim .glow{ animation:igniteGlow .62s ease-out both; transform-box:fill-box; transform-origin:center; }
@keyframes igniteCore{
  0%{ transform:scale(.2); opacity:0; }
  55%{ transform:scale(1.8); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}
@keyframes igniteGlow{
  0%{ transform:scale(.4); opacity:0; }
  60%{ transform:scale(1.5); opacity:1; }
  100%{ transform:scale(1); opacity:.9; }
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------------------------------------------------------------- annotation card (word_trainer 视觉，保持原样) */
.annot-card{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(460px, 86vw);
  padding:15px 18px 14px;
  border-radius:20px;
  border:1px solid var(--card-line);
  background:linear-gradient(180deg, rgba(19,28,52,.97), rgba(12,18,34,.98));
  box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  text-align:center;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.annot-card[data-state="annotating"]{
  border-color:rgba(94,234,212,.30);
  box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 40px rgba(94,234,212,.06);
}
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.chip{
  font-size:11px; letter-spacing:.5px; color:var(--teal);
  background:rgba(94,234,212,.10); border:1px solid rgba(94,234,212,.22);
  padding:4px 10px; border-radius:999px; white-space:nowrap;
}
.level{ font-size:11px; color:var(--mute); letter-spacing:.08em; }

.card-body{ min-height:150px; display:flex; flex-direction:column; }
.annot-card[data-state="idle"] .card-body{ justify-content:center; }
.word-row{
  display:flex; align-items:baseline; justify-content:center; flex-wrap:nowrap;
  min-height:58px; margin:10px 0 2px;
  font-weight:800; line-height:1.2; letter-spacing:.5px; color:#eef2ff;
  overflow-x:auto; padding:2px 0;
}
.word-row .ch{ flex:none; }
.word-row .ch.space{ opacity:.45; font-size:.58em; transform:translateY(-.18em); }
.word-row .cut{
  flex:none; width:10px; height:1.12em; margin:0; padding:0; border:0;
  background:transparent; cursor:pointer; position:relative;
}
.word-row .cut::after{
  content:""; position:absolute; left:50%; top:4%; bottom:4%; width:2px;
  transform:translateX(-50%); border-radius:2px;
  background:rgba(148,163,204,.22); transition:.12s;
}
.word-row .cut:hover::after{ background:rgba(94,234,212,.6); }
.word-row .cut.on::after{ background:var(--teal); box-shadow:0 0 10px rgba(94,234,212,.8); }
.idle-hint{
  min-height:58px; display:flex; align-items:center; justify-content:center;
  font-size:13.5px; font-weight:500; letter-spacing:.04em; color:var(--mute);
}
.idle-hint b{ color:var(--sub); font-weight:600; }

.word-meta{ margin:0; min-height:18px; font-size:12.5px; line-height:1.5; color:var(--sub); }
.piece-preview{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
  min-height:40px; margin-top:10px;
}
.piece-preview .piece{
  font-size:16px; font-weight:700; padding:5px 11px; border-radius:12px;
  background:rgba(94,234,212,.10); border:1px solid rgba(94,234,212,.28); color:#b8fff4;
}
.piece-preview .pipe{ color:var(--mute); font-size:12px; }
.piece-preview .pcount{
  font-size:10.5px; color:var(--mute); border:1px solid var(--card-line);
  border-radius:999px; padding:3px 9px;
}
.card-hint{
  margin:8px 0 0; min-height:16px;
  font-size:11.5px; line-height:1.55; letter-spacing:.03em; color:var(--mute);
}
.card-actions{ display:flex; gap:9px; margin-top:12px; }
.btn-card{
  appearance:none; cursor:pointer; border-radius:12px;
  font-size:13px; font-weight:600; line-height:1; padding:11px 14px;
  transition:.15s; white-space:nowrap;
}
.btn-card.ghost{
  flex:1; min-width:80px;
  border:1px solid var(--card-line); background:rgba(255,255,255,.04); color:#dfe6ff;
}
.btn-card.ghost:hover:not(:disabled){ background:rgba(255,255,255,.09); }
.btn-card.primary{
  flex:1.5; min-width:132px; border:0; color:#06231f; font-weight:700;
  background:linear-gradient(135deg, #7ff3dd, #5eead4 45%, #38bdf8);
  box-shadow:0 8px 24px rgba(94,234,212,.24);
}
.btn-card.primary:hover:not(:disabled){ filter:brightness(1.06); }
.btn-card:disabled{ opacity:.32; cursor:default; box-shadow:none; }
.btn-card:active:not(:disabled){ transform:scale(.985); }

/* ---------------------------------------------------------------- dock (pointprint 读数条) */
.dock{ display:flex; justify-content:center; padding:2px 0 calc(14px + env(safe-area-inset-bottom,0px)); }
.dock-inner{
  width:min(700px,100%); min-height:74px;
  display:flex; align-items:center; gap:20px;
  padding:12px 20px;
  border-radius:18px;
  border:1px solid rgba(217,188,125,.15);
  background:linear-gradient(180deg, rgba(17,24,38,.80), rgba(8,13,22,.92));
  box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.035);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
}
.dock-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
.dock-primary{
  font-size:13.5px; line-height:1.3; letter-spacing:.04em; color:var(--sub);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:20px;
}
.dock-primary.tone-word{
  font-family:var(--serif); font-size:clamp(22px,2.6vw,30px);
  line-height:1.15; letter-spacing:.01em; color:var(--ink); min-height:34px;
}
.dock-primary.tone-flash{ color:var(--gold-bright); }
.dock-secondary{
  font-size:11px; letter-spacing:.06em; line-height:1.4; color:var(--mute);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:15px;
}
.dock-actions{ display:flex; gap:8px; flex:0 0 auto; }
.dock-actions:empty{ display:none; }
.btn-mini{
  appearance:none; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--line); background:rgba(255,255,255,.02); color:var(--sub);
  font-size:12px; line-height:1; letter-spacing:.08em; padding:9px 14px;
  border-radius:999px; cursor:pointer; white-space:nowrap; transition:.16s;
}
.btn-mini:hover{ border-color:rgba(217,188,125,.45); color:var(--ink); background:rgba(217,188,125,.05); }
.btn-mini.primary{
  border-color:transparent;
  background:linear-gradient(180deg, rgba(233,206,150,.95), rgba(206,173,110,.92));
  color:#221a0b; font-weight:600;
}
.btn-mini.primary:hover{ background:linear-gradient(180deg, #f4ddaa, #d7b878); }

/* ---------------------------------------------------------------- toast */
.toast{
  position:fixed; left:50%; bottom:120px; transform:translateX(-50%);
  z-index:60; padding:10px 16px; border-radius:12px;
  background:rgba(10,16,28,.94); border:1px solid rgba(217,188,125,.22);
  color:var(--ink); font-size:12.5px; letter-spacing:.04em;
  box-shadow:0 18px 50px rgba(0,0,0,.5);
  animation:toastIn .16s ease-out;
}
@keyframes toastIn{ from{ opacity:0; transform:translate(-50%,6px); } to{ opacity:1; transform:translate(-50%,0); } }

/* ---------------------------------------------------------------- responsive */
@media (max-width: 900px){
  .annot-progress{ display:none; }
  .brand-sub{ display:none; }
}
@media (max-width: 720px){
  .topbar{ gap:10px; }
  .annot-card{ width:88vw; padding:13px 14px 12px; }
  .card-body{ min-height:140px; }
  .word-row{ min-height:50px; margin-top:8px; }
  .dock-inner{ min-height:66px; padding:10px 14px; gap:12px; }
  .dock-primary.tone-word{ font-size:22px; min-height:28px; }
  .btn{ padding:8px 11px; font-size:11.5px; }
  .box-pill{ display:inline-block; padding:6px 9px; font-size:11px; letter-spacing:.02em; }
}
@media (max-height: 640px){
  .annot-card{ padding:11px 14px 10px; }
  .card-body{ min-height:120px; }
  .word-row{ min-height:44px; margin:6px 0 0; }
  .piece-preview{ min-height:34px; margin-top:6px; }
  .card-hint{ display:none; }
  .dock-inner{ min-height:60px; }
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001s !important; animation-iteration-count:1 !important;
    transition-duration:.001s !important;
  }
}

/* =========================================================================
   v0.3 增补：徽标 / 回看条 / 抽屉（已标注词汇 + 箱库）/ 箱训练
   ========================================================================= */
.badge{
  display:inline-block; min-width:16px; margin-left:6px; padding:1px 5px;
  border-radius:999px; background:rgba(217,188,125,.18); color:var(--gold);
  font-size:10px; letter-spacing:.02em; line-height:1.5; text-align:center;
}
.btn-mini.danger{ border-color:rgba(194,104,90,.30); color:rgba(224,150,132,.95); }
.btn-mini.danger:hover{ border-color:rgba(194,104,90,.55); color:#f0b3a4; background:rgba(194,104,90,.08); }

.viewbar{
  position:absolute; left:50%; top:10px; transform:translateX(-50%);
  z-index:6; display:flex; align-items:center; gap:14px;
  padding:8px 12px 8px 16px; border-radius:999px;
  border:1px solid rgba(194,104,90,.35);
  background:linear-gradient(180deg, rgba(28,20,22,.92), rgba(16,11,13,.94));
  color:rgba(233,225,207,.9); font-size:12px; letter-spacing:.05em;
  box-shadow:0 16px 40px rgba(0,0,0,.45);
}
.viewbar .btn-mini{ padding:7px 12px; font-size:11.5px; }

.scrim{
  position:fixed; inset:0; z-index:35;
  background:rgba(3,6,12,.58);
  animation:fadeIn .18s ease-out;
}
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

.drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:40;
  width:min(560px, 94vw);
  display:flex; flex-direction:column;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg, #0b1322 0%, #080d17 100%);
  border-left:1px solid rgba(217,188,125,.18);
  box-shadow:-30px 0 80px rgba(0,0,0,.5);
  animation:slideIn .26s cubic-bezier(.22,.9,.26,1);
}
@keyframes slideIn{ from{ transform:translateX(40px); opacity:0; } to{ transform:none; opacity:1; } }
.drawer-head{ display:flex; align-items:center; gap:10px; }
.drawer-head h2{
  margin:0; font-family:var(--serif); font-weight:600; font-size:19px;
  letter-spacing:.16em; color:var(--ink);
}
.drawer-meta{ font-size:11px; letter-spacing:.05em; color:var(--mute); margin-right:auto; }
.icon-btn{
  appearance:none; border:none; background:transparent; color:var(--mute);
  font-size:22px; line-height:1; cursor:pointer; padding:2px 8px; border-radius:8px;
}
.icon-btn:hover{ color:var(--ink); background:rgba(255,255,255,.05); }
.drawer-body{ flex:1; overflow-y:auto; overscroll-behavior:contain; margin-top:16px; padding-right:2px; }
.drawer-body::-webkit-scrollbar{ width:6px; }
.drawer-body::-webkit-scrollbar-thumb{ background:rgba(217,188,125,.16); border-radius:3px; }
.drawer-tools{ display:flex; gap:10px; align-items:center; margin-bottom:14px; }
.annot-search{
  flex:1; min-width:120px; background:rgba(0,0,0,.28); border:1px solid var(--card-line);
  color:#dfe6ff; border-radius:10px; padding:9px 12px; font-family:inherit; font-size:13px; outline:none;
}
.annot-search:focus{ border-color:rgba(94,234,212,.5); box-shadow:0 0 0 3px rgba(94,234,212,.08); }
.drawer-empty{ margin:22px 4px; font-size:12.5px; line-height:1.9; color:var(--mute); letter-spacing:.03em; }

.annot-table-wrap{ overflow-x:auto; }
.annot-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
.annot-table th{
  text-align:left; color:var(--mute); font-weight:600; font-size:10.5px;
  padding:4px 6px 8px; border-bottom:1px solid var(--card-line); white-space:nowrap;
}
.annot-table td{ padding:9px 6px; border-bottom:1px solid rgba(255,255,255,.05); vertical-align:middle; }
.annot-table tr:last-child td{ border-bottom:0; }
.annot-table .aw{ font-weight:700; white-space:nowrap; color:#eef2ff; }
.annot-table .ap{ min-width:120px; }
.annot-table .ap .piece{
  font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:8px;
  background:rgba(94,234,212,.10); border:1px solid rgba(94,234,212,.24); color:#b8fff4;
}
.annot-table .ap .pipe{ color:var(--mute); font-size:10px; margin:0 2px; }
.annot-table .an{ color:var(--sub); white-space:nowrap; }
.annot-table .at{ color:var(--mute); white-space:nowrap; font-size:11px; }
.annot-table .ao{ white-space:nowrap; text-align:right; }
.annot-table .lock{ color:var(--mute); font-size:11px; }
.link-btn{
  border:0; background:none; color:var(--teal); font-family:inherit; font-size:11.5px;
  cursor:pointer; padding:3px 5px; border-radius:6px;
}
.link-btn:hover{ background:rgba(94,234,212,.08); }
.link-btn.del{ color:rgba(224,150,132,.95); }
.link-btn.del:hover{ background:rgba(224,150,132,.08); }

.box-card{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  border:1px solid var(--card-line); border-radius:14px;
  background:rgba(255,255,255,.018); padding:13px 14px; margin-bottom:10px;
}
.box-info{ flex:1; min-width:150px; display:flex; flex-direction:column; gap:4px; }
.box-info b{ font-size:14px; letter-spacing:.06em; color:#eef2ff; }
.box-info span{ font-size:11px; color:var(--mute); letter-spacing:.04em; }

/* ---------------- training ---------------- */
.train-view{
  position:fixed; inset:0; z-index:70;
  display:flex; flex-direction:column;
  padding:0 clamp(12px,2.4vw,28px);
  background:
    radial-gradient(1000px 700px at 50% 20%, #0b1426 0%, #070b13 60%, #04060b 100%);
}
.train-top{ display:flex; align-items:center; gap:14px; padding:16px 2px 10px; max-width:760px; width:100%; margin:0 auto; }
.train-mid{ flex:1; display:flex; align-items:center; gap:12px; }
.train-mid .track{ flex:1; height:6px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
.train-mid .track i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,#7ff3dd,#5eead4 45%,#38bdf8); border-radius:999px; transition:width .3s ease; }
.train-count{ font-size:12px; color:var(--sub); white-space:nowrap; }
.train-box-label{ font-size:11.5px; color:var(--gold); border:1px solid rgba(217,188,125,.28); background:rgba(217,188,125,.06); padding:6px 12px; border-radius:999px; white-space:nowrap; }
.train-main{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; padding-bottom:20px; }
.qcard{
  width:min(520px, 94vw); border-radius:22px; padding:20px 22px 18px;
  background:linear-gradient(180deg, rgba(19,28,52,.97), rgba(12,18,34,.98));
  border:1px solid var(--card-line);
  box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
}
.qhead{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.qchip{
  font-size:11px; letter-spacing:.5px; color:var(--teal);
  background:rgba(94,234,212,.10); border:1px solid rgba(94,234,212,.22);
  padding:4px 10px; border-radius:999px;
}
.qlevel{ font-size:11px; color:var(--mute); letter-spacing:.08em; }
.qword{
  margin-top:18px; text-align:center; font-size:40px; font-weight:800;
  letter-spacing:.5px; line-height:1.15; color:#eef2ff; word-break:break-word;
}
.qphon{ margin-top:4px; text-align:center; font-size:13px; color:var(--sub); min-height:18px; }
.options{ display:flex; flex-direction:column; gap:9px; margin-top:18px; }
.opt{
  display:flex; align-items:center; gap:10px; width:100%;
  border:1px solid var(--card-line); border-radius:13px;
  background:rgba(255,255,255,.03); color:#e6ebff; font-family:inherit;
  font-size:14px; text-align:left; padding:11px 13px; cursor:pointer; transition:.14s;
}
.opt:hover:not(:disabled){ border-color:rgba(94,234,212,.45); background:rgba(94,234,212,.06); }
.opt:disabled{ cursor:default; }
.opt-key{
  flex:none; width:22px; height:22px; display:grid; place-items:center;
  border-radius:7px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.08);
  font-size:11px; color:var(--sub);
}
.opt.correct{ border-color:rgba(52,211,153,.7); background:rgba(52,211,153,.14); color:#c7f9e5; }
.opt.correct .opt-key{ background:rgba(52,211,153,.25); color:#b7f7dd; }
.opt.wrong{ border-color:rgba(251,113,133,.7); background:rgba(251,113,133,.12); color:#ffd4da; }
.opt.dim{ opacity:.45; }
.train-feedback{
  position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
  width:min(520px, 94vw); border-radius:20px; padding:18px 20px 16px;
  background:linear-gradient(180deg, rgba(19,28,52,.98), rgba(12,18,34,.99));
  border:1px solid rgba(94,234,212,.28);
  box-shadow:0 30px 80px rgba(0,0,0,.6); text-align:center;
  animation:fbIn .18s ease-out;
}
@keyframes fbIn{ from{ opacity:0; transform:translate(-50%,10px); } to{ opacity:1; transform:translate(-50%,0); } }
.verdict{ font-size:19px; font-weight:800; letter-spacing:.08em; color:#7ff3dd; }
.verdict.bad{ color:#fda4af; }
.fb-word{ margin-top:8px; font-size:22px; font-weight:700; color:#eef2ff; }
.fb-trans{ margin-top:6px; font-size:13px; line-height:1.7; color:var(--sub); }
.train-feedback .btn-card.primary{ margin-top:12px; width:100%; }
.train-end{ text-align:center; color:var(--ink); }
.end-stars{ font-size:30px; letter-spacing:.2em; color:var(--gold); }
.end-stars .off{ color:rgba(255,255,255,.12); }
.train-end h2{ margin:10px 0 6px; font-size:22px; letter-spacing:.1em; }
.train-end p{ margin:0; color:var(--sub); font-size:13px; line-height:1.8; }
.train-end-actions{ display:flex; gap:10px; margin-top:20px; justify-content:center; }
.train-end-actions .btn-card{ flex:0 0 auto; min-width:130px; }

@media (max-width: 720px){
  .top-actions .btn{ padding:7px 9px; font-size:11px; }
  .drawer{ width:100vw; }
  .train-top{ padding-top:12px; }
  .qword{ font-size:32px; }
  .qcard{ padding:16px 16px 14px; }
  .train-feedback{ bottom:10px; }
  .viewbar{ top:6px; font-size:11px; padding:6px 10px 6px 12px; }
}

    if (!state.template || state.template.mode !== mode) {
      state.template = generateTemplate();
      saveState();
    }
  }

  /* ---------------------------------------------------------------- map */
  function layoutMap() {
    var rect = stageEl.getBoundingClientRect();
    stageW = Math.max(1, Math.round(rect.width));
    stageH = Math.max(1, Math.round(rect.height));
    var tpl = state.template;
    var scrollMode = tpl.mode === 'scroll';
    var W = stageW;
    var H = scrollMode ? tpl.plateH : stageH;

    if (scrollMode) {
      mapScroll.classList.add('scrollable');
      mapEl.style.width = '100%';
      mapEl.style.height = H + 'px';
    } else {
      mapScroll.classList.remove('scrollable');
      mapScroll.scrollTop = 0;
      mapEl.style.width = '100%';
      mapEl.style.height = '100%';
    }
    mapEl.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    var rnd = mulberry32(20261113);
    var decor = '';
    var decorN = Math.round(W * H / 4200);
    for (var i = 0; i < decorN; i++) {
      var dx = 34 + rnd() * (W - 68), dy = 34 + rnd() * (H - 68);
      var dr = 0.3 + rnd() * 1.1, op = 0.025 + rnd() * 0.07;
      decor += '<circle cx="' + dx.toFixed(1) + '" cy="' + dy.toFixed(1) + '" r="' + dr.toFixed(2) +
        '" opacity="' + op.toFixed(3) + '" fill="#aebbd4"/>';
    }
    var frame =
      '<rect class="frame-outer" x="10.5" y="10.5" width="' + Math.max(0, W - 21) + '" height="' + Math.max(0, H - 21) + '" rx="14"/>' +
      '<rect class="frame-inner" x="24.5" y="24.5" width="' + Math.max(0, W - 49) + '" height="' + Math.max(0, H - 49) + '" rx="9"/>' +
      '<circle class="corner" cx="24" cy="24" r="1.6"/><circle class="corner" cx="' + (W - 24) + '" cy="24" r="1.6"/>' +
      '<circle class="corner" cx="24" cy="' + (H - 24) + '" r="1.6"/><circle class="corner" cx="' + (W - 24) + '" cy="' + (H - 24) + '" r="1.6"/>';

    var entries = currentViewEntries();
    var lit = {};
    entries.forEach(function (e) { lit[e.p] = e; });
    var hitR = scrollMode ? 14 : Math.max(8, Math.min(20, Math.sqrt(W * H / MAP_POINTS) * 0.5));
    var pts = '';
    for (var k = 0; k < tpl.points.length; k++) {
      var pt = tpl.points[k];
      var x = pt[0] * W, y = pt[1] * H;
      var entry = lit[k];
      var cls = 'pt ' + (entry ? 'lit' : 'empty');
      if (ui.selected === k) cls += ' target';
      if (ui.pinned === k) cls += ' pin';
      if (ui.anim === k) cls += ' anim';
      var inner = entry
        ? '<circle class="glow" r="11"/><circle class="core" r="3.2"/><circle class="spark" r="1.1"/>'
        : '<circle class="ring" r="3.1"/>';
      var halo = ui.selected === k ? '<circle class="halo-select" r="10"/>' : '';
      var pinRing = (entry && ui.pinned === k) ? '<circle class="pin-ring" r="8"/>' : '';
      pts += '<g class="' + cls + '" data-i="' + k + '" transform="translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')">' +
        '<circle class="hit" r="' + hitR.toFixed(1) + '"/>' + inner + pinRing + halo + '</g>';
    }
    mapEl.innerHTML = '<defs><radialGradient id="litGlow" cx="50%" cy="50%" r="50%">' +
      '<stop offset="0%" stop-color="#f6dc9e" stop-opacity=".62"/>' +
      '<stop offset="38%" stop-color="#e9c37a" stop-opacity=".24"/>' +
      '<stop offset="100%" stop-color="#e9c37a" stop-opacity="0"/>' +
      '</radialGradient></defs>' +
      '<g class="decor">' + decor + '</g>' +
      '<g class="frame" pointer-events="none">' + frame + '</g>' +
      '<g class="points">' + pts + '</g>';
  }

  /* 手机滑动模式下：让选中的点滚出卡片遮挡区，出现在卡片上方 */
  function ensureSelectedVisible() {
    if (!state.template || state.template.mode !== 'scroll' || ui.selected == null) return;
    var stageRect = stageEl.getBoundingClientRect();
    var cardRect = cardEl.getBoundingClientRect();
    var cardTop = cardRect.top - stageRect.top;
    var py = state.template.points[ui.selected][1] * state.template.plateH;
    var screenY = py - mapScroll.scrollTop;
    if (screenY > cardTop - 26 && screenY < (cardRect.bottom - stageRect.top) + 26) {
      var target = py - (cardTop - 32);
      var max = Math.max(0, mapScroll.scrollHeight - mapScroll.clientHeight);
      mapScroll.scrollTop = Math.max(0, Math.min(target, max));
    }
  }
  function scheduleEnsureVisible() {
    if (state.template && state.template.mode === 'scroll') {
      requestAnimationFrame(function () { ensureSelectedVisible(); });
    }
  }

  /* ---------------------------------------------------------------- card */
  function idleHint() {
    if (ui.viewSealed != null) return '回看第 ' + ui.viewSealed + ' 箱（只读）';
    if (isFull()) return '<b>本箱已满</b>（' + state.capacity + ' 词）· 按底部「封箱」';
    if (state.pointer >= POOL.length) return '<b>词池已空</b> · 点「已标注词汇」查看已写入的词';
    if (state.entries.length === 0) return '在图中点一个空位';
    return '继续<b>点空位</b>，为下一个词选位置';
  }
  function idleSubhint() {
    if (ui.viewSealed != null) return '封存的箱只读 · 点已点亮的点读标签';
    if (isFull()) return '满 ' + state.capacity + ' 词 · 封箱后新箱复用同一张图';
    return '选点后这里会刷新一个待标注的词 · 标注完成即点亮该点';
  }
  function fitFont(len) {
    var cardW = Math.min(460, stageEl.clientWidth * 0.86);
    var avail = cardW - 44;
    var gap = 10;
    var size = Math.floor((avail - Math.max(0, len - 1) * gap) / Math.max(1, len * 0.62));
    return Math.max(14, Math.min(42, size));
  }
  function wordRowHtml(word, cuts) {
    var w = word[0], html = '';
    for (var i = 0; i < w.length; i++) {
      var ch = w.charAt(i);
      html += ch === ' ' ? '<span class="ch space">&#9251;</span>' : '<span class="ch">' + esc(ch) + '</span>';
      if (i < w.length - 1) {
        var pos = i + 1;
        html += '<button type="button" class="cut' + (cuts.indexOf(pos) >= 0 ? ' on' : '') + '" data-c="' + pos +
          '" title="在第 ' + pos + ' 个字母后切分" aria-label="在第 ' + pos + ' 个字母后切分"></button>';
      }
    }
    return html;
  }
  function renderCard() {
    var sealedView = ui.viewSealed != null;
    cardEl.hidden = sealedView || !!ui.train;
    if (cardEl.hidden) return;
    var word = ui.current;
    if (!word) {
      cardEl.dataset.state = 'idle';
      wordRow.style.fontSize = '';
      wordRow.innerHTML = '<span class="idle-hint">' + idleHint() + '</span>';
      wordMeta.hidden = true; wordMeta.textContent = '';
      piecePreview.hidden = true; piecePreview.innerHTML = '';
      cardHint.textContent = idleSubhint();
      cardLevel.textContent = '';
      setBtn(skipBtn, false); setBtn(clearBtn, false); setBtn(saveBtn, false);
      saveBtn.textContent = '保存并点亮';
      return;
    }
    cardEl.dataset.state = 'annotating';
    wordMeta.hidden = false; piecePreview.hidden = false;
    cardLevel.textContent = word[4] === 'cet6' ? 'CET6 新增' : 'CET4';
    wordRow.style.fontSize = fitFont(word[0].length) + 'px';
    wordRow.innerHTML = wordRowHtml(word, ui.cuts);
    wordMeta.textContent = (word[1] ? '/' + word[1] + '/ · ' : '') + posLabel(word[2]) + ' · ' + word[3];
    var pieces = piecesFromCuts(word[0], ui.cuts);
    piecePreview.innerHTML = pieces.map(function (p) {
      return '<span class="piece">' + esc(p) + '</span>';
    }).join('<span class="pipe">/</span>') + '<span class="pcount">' + pieces.length + ' 份</span>';
    if (ui.splitEdit) {
      cardHint.textContent = '编辑切分 · 保存后更新这条标注';
      saveBtn.textContent = '保存切分';
    } else if (ui.replace) {
      cardHint.textContent = '改词：保存后「' + ui.replace.old.w + '」回到词池，新词写入这个点';
      saveBtn.textContent = '保存并替换';
    } else {
      cardHint.textContent = '点字母之间的空隙下刀 · 最多切 2 刀（3 份） · Enter 保存点亮 · S 跳过';
      saveBtn.textContent = '保存并点亮';
    }
    setBtn(skipBtn, !ui.splitEdit && !ui.replace);
    setBtn(clearBtn, true);
    setBtn(saveBtn, true);
  }
  function setBtn(el, on) { el.disabled = !on; }

  /* ---------------------------------------------------------------- dock */
  function renderDock() {
    var sealedView = ui.viewSealed != null;
    var viewEntries = currentViewEntries();
    var full = isFull();
    var primary = '', secondary = '', tone = '', actions = [];

    if (ui.train) { dockEl.innerHTML = ''; return; }

    if (ui.flash) {
      primary = ui.flash.primary; secondary = ui.flash.secondary; tone = 'tone-word tone-flash';
    } else if (ui.pinned != null) {
      var pe = null, peOrder = 0;
      for (var i = 0; i < viewEntries.length; i++) {
        if (viewEntries[i].p === ui.pinned) { pe = viewEntries[i]; peOrder = i + 1; break; }
      }
      if (pe) {
        primary = pe.w;
        secondary = '第 ' + peOrder + ' 个点亮 · ' +
          (sealedView ? '第 ' + ui.viewSealed + ' 箱（只读）' : '第 ' + state.boxNo + ' 箱') +
          ' · ' + pe.pieces.join(' / ') + '（' + pe.pieces.length + ' 份）';
        tone = 'tone-word';
        if (!sealedView) {
          actions = [{ key: 'replace', label: '改词' }, { key: 'extinguish', label: '熄灭', danger: true }];
        }
      } else {
        ui.pinned = null;
      }
    } else if (ui.selected != null && ui.current) {
      primary = ui.replace ? '改词中' : (ui.splitEdit ? '编辑切分中' : '空位已选中');
      secondary = ui.replace
        ? '「' + ui.replace.old.w + '」→「' + ui.current[0] + '」· 保存后替换'
        : (ui.splitEdit ? '正在调整「' + ui.current[0] + '」的切分' : '正在标注「' + ui.current[0] + '」· 保存后点亮这个点');
    } else if (ui.hover != null) {
      var he = null;
      for (var j = 0; j < viewEntries.length; j++) if (viewEntries[j].p === ui.hover) he = viewEntries[j];
      if (he) { primary = he.w; secondary = '点击固定读数'; tone = 'tone-word'; }
      else { primary = '空位 · 未写入'; secondary = '点击它，为下一个待标注词选一个位置'; }
    } else if (sealedView) {
      primary = '第 ' + ui.viewSealed + ' 箱 · 已封存';
      secondary = viewEntries.length + ' 词 · 只读回看 · 点已点亮的点读标签';
    } else if (full) {
      primary = '本箱已满';
      secondary = '满 ' + state.capacity + ' 词 · 封箱后新箱复用同一张图';
      actions = [{ key: 'seal', label: '封箱', kind: 'primary' }];
    } else if (state.entries.length === 0) {
      primary = '点空位 → 标注 → 点亮';
      secondary = '第 ' + state.boxNo + ' 箱 · 目标 ' + state.capacity + ' 词 · 点位固定';
    } else {
      primary = '继续点空位，或点已点亮的星读词';
      secondary = '第 ' + state.boxNo + ' 箱 · 已点亮 ' + state.entries.length + ' / ' + state.capacity;
    }
    if (!sealedView && !ui.train && !ui.pinned && !ui.current && state.entries.length > 0 && !full) {
      actions = [{ key: 'seal', label: '封箱' }];
    }
    var actionsHtml = actions.map(function (a) {
      return '<button class="btn-mini ' + (a.kind || '') + (a.danger ? ' danger' : '') + '" data-action="' + a.key + '">' + esc(a.label) + '</button>';
    }).join('');
    dockEl.innerHTML =
      '<div class="dock-inner">' +
        '<div class="dock-text">' +
          '<div class="dock-primary ' + tone + '">' + esc(primary) + '</div>' +
          '<div class="dock-secondary">' + esc(secondary) + '</div>' +
        '</div>' +
        (actionsHtml ? '<div class="dock-actions">' + actionsHtml + '</div>' : '') +
      '</div>';
  }

  /* ---------------------------------------------------------------- header / popover */
  function renderHeader() {
    var n = annotatedTotal();
    annotCount.textContent = '已标注 ' + n + ' / ' + TOTAL_WORDS;
    annotFill.style.width = (n / TOTAL_WORDS * 100).toFixed(2) + '%';
    var boxText = ui.viewSealed != null
      ? '回看第 ' + ui.viewSealed + ' 箱'
      : (isMobileLayout()
        ? state.entries.length + ' / ' + state.capacity + ' ▾'
        : '第 ' + state.boxNo + ' 箱 · ' + state.entries.length + ' / ' + state.capacity + ' ▾');
    boxPill.textContent = boxText;
    boxPill.title = '第 ' + state.boxNo + ' 箱 · 每箱词数 ' + state.capacity + '（点此调整 100/200/300/400）';
    boxesBadge.textContent = String(state.sealed.length);
    boxesBadge.hidden = state.sealed.length === 0;
    viewbar.hidden = ui.viewSealed == null;
    if (ui.viewSealed != null) {
      var box = state.sealed.filter(function (b) { return b.boxNo === ui.viewSealed; })[0];
      viewbarText.textContent = '回看第 ' + ui.viewSealed + ' 箱 · ' + (box ? box.entries.length : 0) + ' 词 · 只读';
    }
  }

  function renderCapOptions() {
    capOptions.innerHTML = CAP_STEPS.map(function (n) {
      return '<button class="cap-opt' + (n === state.capacity ? ' active' : '') + '" data-cap="' + n + '">' + n + '</button>';
    }).join('');
  }
  function openCapPopover() {
    if (ui.viewSealed != null) return;
    renderCapOptions();
    capPopover.hidden = false;
    var rect = boxPill.getBoundingClientRect();
    capPopover.style.top = Math.round(rect.bottom + 8) + 'px';
    capPopover.style.right = Math.round(Math.max(12, window.innerWidth - rect.right)) + 'px';
    ui.capOpen = true;
  }
  function closeCapPopover() {
    capPopover.hidden = true;
    ui.capOpen = false;
  }
  function setCapacity(n) {
    if (CAP_STEPS.indexOf(n) < 0) return;
    if (n < state.entries.length) {
      toast('当前箱已有 ' + state.entries.length + ' 词，不能设成 ' + n + '；先封箱或熄灭一些词');
      return;
    }
    state.capacity = n;
    saveState();
    closeCapPopover();
    renderAll();
    toast('每箱词数改为 ' + n);
  }

  /* ---------------------------------------------------------------- backup / import */
  function buildBackup() {
    return {
      format: 'pointfield',
      version: 1,
      app: '点图 · 标注记忆',
      exportedAt: new Date().toISOString(),
      state: JSON.parse(JSON.stringify(state)),
    };
  }
  function exportJsonString() { return JSON.stringify(buildBackup()); }
  function exportBackupFile() {
    try {
      var blob = new Blob([JSON.stringify(buildBackup(), null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'pointfield-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast('存档已导出 · 可发到另一台设备「合并导入」');
      closeMenu();
    } catch (e) {
      toast('导出失败：浏览器不允许下载');
    }
  }
  function parseBackup(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { return null; }
    var rawState = obj && obj.format === 'pointfield' ? obj.state : obj;
    if (!rawState || rawState.v !== 3) return null;
    var cleaned = sanitize(JSON.parse(JSON.stringify(rawState)));
    return { format: (obj && obj.format) || 'state', exportedAt: (obj && obj.exportedAt) || '', state: cleaned };
  }
  function countWords(st) {
    var n = st.entries.length;
    st.sealed.forEach(function (b) { n += b.entries.length; });
    return n;
  }
  function openImportModal(parsed) {
    ui.pendingImport = parsed;
    var imp = parsed.state;
    importSummary.textContent =
      '存档：' + (parsed.format === 'pointfield' ? '点图存档' : '原始状态') +
      (parsed.exportedAt ? ' · 导出于 ' + fmtDate(parsed.exportedAt) : '') + '\n' +
      '导入内容：' + countWords(imp) + ' 词 · ' + imp.sealed.length + ' 个封箱 · 当前箱 ' + imp.entries.length + ' 词\n' +
      '本机现有：' + countWords(state) + ' 词 · ' + state.sealed.length + ' 个封箱 · 当前箱 ' + state.entries.length + ' 词\n\n' +
      '合并导入：只追加本机没有的词，不覆盖现有数据（推荐多设备积累）\n' +
      '覆盖导入：用存档替换本机全部数据（不可撤销）';
    importModal.hidden = false;
  }
  function closeImportModal() { importModal.hidden = true; ui.pendingImport = null; }
  function nextFreePoint(list) {
    var used = {};
    list.forEach(function (e) { used[e.p] = 1; });
    for (var i = 0; i < MAP_POINTS; i++) if (!used[i]) return i;
    return 0;
  }
  function mergeImport(imp) {
    var allWords = {}, added = { current: 0, boxes: 0, words: 0, skipped: 0 };
    state.entries.forEach(function (e) { allWords[e.w] = 1; });
    state.sealed.forEach(function (b) { b.entries.forEach(function (e) { allWords[e.w] = 1; }); });
    var boxNo = 1;
    state.sealed.forEach(function (b) { if (b.boxNo >= boxNo) boxNo = b.boxNo + 1; });
    var overflow = [];
    imp.entries.forEach(function (e) {
      if (allWords[e.w]) { added.skipped++; return; }
      allWords[e.w] = 1;
      if (state.entries.length < state.capacity) {
        state.entries.push({ p: nextFreePoint(state.entries), w: e.w, pieces: e.pieces.slice(), t: e.t || Date.now() });
        added.current++; added.words++;
      } else {
        overflow.push({ w: e.w, pieces: e.pieces.slice(), t: e.t || Date.now() });
      }
    });
    if (overflow.length) {
      var entries = overflow.map(function (e, i) { return { p: i, w: e.w, pieces: e.pieces, t: e.t }; });
      state.sealed.push({ boxNo: boxNo++, capacity: 400, entries: entries, sealedAt: new Date().toISOString() });
      added.boxes++; added.words += entries.length;
    }
    imp.sealed.forEach(function (box) {
      var seenP = {}, nextP = 0, entries = [];
      box.entries.forEach(function (e) {
        if (allWords[e.w]) { added.skipped++; return; }
        allWords[e.w] = 1;
        var p = (Number.isInteger(e.p) && e.p >= 0 && e.p < MAP_POINTS && !seenP[e.p]) ? e.p : -1;
        if (p < 0) { while (seenP[nextP]) nextP++; p = nextP; }
        seenP[p] = 1;
        entries.push({ p: p, w: e.w, pieces: e.pieces.slice(), t: e.t || Date.now() });
      });
      if (!entries.length) return;
      state.sealed.push({
        boxNo: boxNo++,
        capacity: CAP_STEPS.indexOf(box.capacity) >= 0 ? box.capacity : 400,
        entries: entries,
        sealedAt: box.sealedAt || new Date().toISOString(),
      });
      added.boxes++; added.words += entries.length;
    });
    state.pointer = 0;
    state.boxNo = Math.max(state.boxNo, boxNo);
    saveState(); renderAll();
    return added;
  }
  function replaceImport(imp) {
    var savedTemplate = state.template;
    state = sanitize(JSON.parse(JSON.stringify(imp)));
    var mode = isMobileLayout() ? 'scroll' : 'fit';
    if (!savedTemplate || savedTemplate.mode !== mode) state.template = generateTemplate();
    else state.template = savedTemplate;
    saveState(); renderAll();
  }
  function applyImport(mode) {
    var parsed = ui.pendingImport;
    if (!parsed) return;
    closeImportModal(); closeMenu();
    if (mode === 'merge') {
      var added = mergeImport(parsed.state);
      toast('合并导入完成：新增 ' + added.words + ' 词 · 新增 ' + added.boxes + ' 个封箱 · 跳过重复 ' + added.skipped + ' 词', 3600);
    } else {
      replaceImport(parsed.state);
      toast('已覆盖导入 · 共 ' + countWords(state) + ' 词', 2800);
    }
  }
  function openMenu() {
    closeCapPopover();
    renderMenu();
    menuPopover.hidden = false;
    var rect = menuBtn.getBoundingClientRect();
    menuPopover.style.top = Math.round(rect.bottom + 8) + 'px';
    menuPopover.style.right = Math.round(Math.max(12, window.innerWidth - rect.right)) + 'px';
    ui.menuOpen = true;
  }
  function closeMenu() {
    menuPopover.hidden = true;
    ui.menuOpen = false;
  }
  function renderMenu() {
    if (ui.installPrompt) installBtn.hidden = false;
  }

  function renderAll() {
    ensureTemplate();
    layoutMap();
    renderCard();
    renderDock();
    renderHeader();
  }

  /* ---------------------------------------------------------------- actions */
  function loadNextWord() {
    for (var i = state.pointer; i < POOL.length; i++) {
      if (!isPlaced(POOL[i][0])) {
        ui.current = POOL[i];
        ui.currentIndex = i;
        ui.cuts = [];
        return;
      }
    }
    ui.current = null;
    ui.currentIndex = -1;
    ui.cuts = [];
  }

  function selectPoint(p) {
    if (ui.viewSealed != null || ui.train || isFull()) return;
    if (entryAt(p)) return;
    if (!ui.current) loadNextWord();
    ui.selected = p;
    ui.pinned = null;
    ui.hover = p;
    renderAll();
    scheduleEnsureVisible();
  }

  function pinPoint(p) {
    ui.pinned = ui.pinned === p ? null : p;
    renderDock();
    layoutMap();
  }

  function toggleCut(pos) {
    if (!ui.current) return;
    var i = ui.cuts.indexOf(pos);
    if (i >= 0) ui.cuts.splice(i, 1);
    else {
      if (ui.cuts.length >= 2) { toast('最多切成 3 份，先取消一个切分'); return; }
      ui.cuts.push(pos);
      ui.cuts.sort(function (a, b) { return a - b; });
    }
    renderCard();
  }
  function clearCuts() { if (!ui.current) return; ui.cuts = []; renderCard(); }
  function skipWord() {
    if (!ui.current || ui.splitEdit || ui.replace) return;
    state.pointer = ui.currentIndex + 1;
    loadNextWord();
    renderAll();
    saveState();
  }
  function cancelSelection() {
    ui.replace = null; ui.splitEdit = null;
    ui.selected = null; ui.current = null; ui.cuts = []; ui.pinned = null;
    renderAll();
  }

  function savePlacement() {
    if (!ui.current) return;
    var pieces = piecesFromCuts(ui.current[0], ui.cuts);

    if (ui.splitEdit) {
      var se = entryAt(ui.splitEdit.p);
      if (se) se.pieces = pieces;
      ui.splitEdit = null; ui.current = null; ui.cuts = []; ui.selected = null;
      toast('切分已更新');
      saveState(); renderAll(); return;
    }
    if (ui.replace) {
      var oldEntry = ui.replace.old;
      var idx = -1;
      for (var i = 0; i < state.entries.length; i++) if (state.entries[i].p === oldEntry.p) { idx = i; break; }
      if (idx >= 0) state.entries.splice(idx, 1);
      var oldIdx = poolIndex(oldEntry.w);
      state.entries.push({ p: oldEntry.p, w: ui.current[0], pieces: pieces, t: Date.now() });
      if (oldIdx >= 0) state.pointer = Math.min(state.pointer, oldIdx);
      var newWord = ui.current[0], oldWord = oldEntry.w;
      ui.replace = null; ui.current = null; ui.cuts = []; ui.selected = null; ui.pinned = null; ui.hover = null;
      ui.anim = oldEntry.p;
      flash(newWord, '已替换「' + oldWord + '」· 旧词回到词池');
      saveState(); renderAll();
      setTimeout(function () { if (ui.anim === oldEntry.p) { ui.anim = null; layoutMap(); } }, 820);
      return;
    }
    if (ui.selected == null || isFull()) return;
    var p = ui.selected;
    state.entries.push({ p: p, w: ui.current[0], pieces: pieces, t: Date.now() });
    state.pointer = ui.currentIndex + 1;
    var order = state.entries.length, word = ui.current[0];
    ui.current = null; ui.selected = null; ui.cuts = []; ui.pinned = null; ui.hover = null;
    ui.anim = p;
    flash(word, '已点亮 · 第 ' + order + ' 个 · ' + pieces.join(' / ') + '（' + pieces.length + ' 份）');
    saveState(); renderAll();
    setTimeout(function () { if (ui.anim === p) { ui.anim = null; layoutMap(); } }, 820);
  }

  function undo() {
    if (ui.selected != null || ui.current || ui.replace || ui.splitEdit) { cancelSelection(); return; }
    if (!state.entries.length) { toast('没有可撤回的放置'); return; }
    var last = state.entries.pop();
    var idx = poolIndex(last.w);
    if (idx >= 0) state.pointer = Math.min(state.pointer, idx);
    ui.pinned = null; ui.hover = null;
    flash(last.w, '已撤回 · 该点重新变回空位');
    saveState(); renderAll();
  }

  function extinguish(p) {
    var idx = -1;
    for (var i = 0; i < state.entries.length; i++) if (state.entries[i].p === p) { idx = i; break; }
    if (idx < 0) return;
    var w = state.entries[idx].w;
    state.entries.splice(idx, 1);
    var pi = poolIndex(w);
    if (pi >= 0) state.pointer = Math.min(state.pointer, pi);
    ui.pinned = null; ui.hover = null;
    toast('已熄灭「' + w + '」· 该词回到词池');
    saveState(); renderAll();
  }

  function startReplace(p) {
    var e = entryAt(p);
    if (!e) return;
    if (!ui.current) loadNextWord();
    if (!ui.current) { toast('词池已空，暂时没有可替换的词'); return; }
    ui.replace = { p: p, old: { p: e.p, w: e.w, pieces: e.pieces.slice() } };
    ui.splitEdit = null;
    ui.selected = p;
    ui.pinned = null;
    renderAll();
    scheduleEnsureVisible();
  }

  function startSplitEdit(p) {
    var e = entryAt(p);
    if (!e) return;
    var word = findWord(e.w) || [e.w, '', '', '', 'cet4', ''];
    ui.splitEdit = { p: p };
    ui.replace = null;
    ui.selected = p;
    ui.current = word;
    ui.cuts = cutsFromPieces(e.w, e.pieces);
    ui.pinned = null;
    closeDrawer();
    renderAll();
    scheduleEnsureVisible();
  }

  function sealBox() {
    if (!state.entries.length) { toast('本箱还是空的'); return; }
    if (ui.viewSealed != null) return;
    var boxNo = state.boxNo;
    state.sealed.push({ boxNo: state.boxNo, capacity: state.capacity, entries: state.entries.slice(), sealedAt: new Date().toISOString() });
    state.boxNo++;
    state.entries = [];
    ui.selected = null; ui.current = null; ui.cuts = []; ui.pinned = null; ui.hover = null;
    flash('第 ' + boxNo + ' 箱已封存', '箱库 +1 · 可在箱库选择这一箱训练');
    saveState(); renderAll();
  }

  function openSealed(boxNo) {
    if (!state.sealed.some(function (b) { return b.boxNo === boxNo; })) return;
    ui.viewSealed = boxNo;
    ui.selected = null; ui.current = null; ui.cuts = []; ui.pinned = null; ui.hover = null;
    closeDrawer();
    renderAll();
  }
  function backToCurrentBox() {
    ui.viewSealed = null;
    ui.pinned = null; ui.hover = null;
    renderAll();
  }

  /* ---------------------------------------------------------------- drawers */
  function openDrawer(kind) {
    ui.drawer = kind;
    drawerEl.hidden = false;
    scrim.hidden = false;
    drawerEl.setAttribute('aria-hidden', 'false');
    renderDrawer();
  }
  function closeDrawer() {
    ui.drawer = null;
    drawerEl.hidden = true;
    scrim.hidden = true;
    drawerEl.setAttribute('aria-hidden', 'true');
  }

  function allAnnotatedRows() {
    var rows = [];
    state.entries.forEach(function (e) {
      rows.push({ boxNo: state.boxNo, p: e.p, w: e.w, pieces: e.pieces, t: e.t, sealed: false });
    });
    state.sealed.forEach(function (box) {
      box.entries.forEach(function (e) {
        rows.push({ boxNo: box.boxNo, p: e.p, w: e.w, pieces: e.pieces, t: e.t || box.sealedAt, sealed: true });
      });
    });
    rows.sort(function (a, b) { return (b.t || 0) - (a.t || 0); });
    return rows;
  }

  function renderDrawer() {
    if (!ui.drawer) return;
    if (ui.drawer === 'annotated') {
      drawerTitle.textContent = '已标注词汇';
      var rows = allAnnotatedRows();
      drawerMeta.textContent = rows.length + ' 条 · 当前箱可编辑/熄灭，封存箱只读';
      var html = '<div class="drawer-tools">' +
        '<input id="annotSearch" class="annot-search" type="search" placeholder="搜索单词或片段…" autocomplete="off">' +
        '<button class="btn-mini" id="exportCsv">导出 CSV</button>' +
        '</div>';
      if (!rows.length) {
        html += '<p class="drawer-empty">还没有写入的词。<br>回点图，点一个空位开始标注。</p>';
      } else {
        html += '<div class="annot-table-wrap"><table class="annot-table"><thead><tr>' +
          '<th>单词</th><th>拆分</th><th>点</th><th>箱</th><th>时间</th><th></th>' +
          '</tr></thead><tbody id="annotTbody">' + rows.slice(0, 300).map(function (r) {
            var canEdit = !r.sealed;
            return '<tr data-search="' + esc((r.w + ' ' + r.pieces.join('')).toLowerCase()) + '">' +
              '<td class="aw">' + esc(r.w) + '</td>' +
              '<td class="ap">' + r.pieces.map(function (p) { return '<span class="piece">' + esc(p) + '</span>'; }).join('<span class="pipe">/</span>') + '</td>' +
              '<td class="an">' + (r.p + 1) + '</td>' +
              '<td class="an">' + (r.sealed ? '第 ' + r.boxNo + ' 箱 🔒' : '第 ' + r.boxNo + ' 箱') + '</td>' +
              '<td class="at">' + fmtDate(new Date(r.t || 0).toISOString()) + '</td>' +
              '<td class="ao">' + (canEdit
                ? '<button class="link-btn" data-edit="' + r.p + '">编辑切分</button><button class="link-btn del" data-del="' + r.p + '">熄灭</button>'
                : '<span class="lock">只读</span>') + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          (rows.length > 300 ? '<p class="drawer-empty">仅显示最近 300 条，导出 CSV 获取全部。</p>' : '');
      }
      drawerBody.innerHTML = html;
      var search = $('annotSearch');
      if (search) search.addEventListener('input', function () {
        var q = this.value.trim().toLowerCase();
        var trs = drawerBody.querySelectorAll('#annotTbody tr');
        for (var i = 0; i < trs.length; i++) {
          trs[i].hidden = q && trs[i].getAttribute('data-search').indexOf(q) < 0;
        }
      });
    } else if (ui.drawer === 'boxes') {
      drawerTitle.textContent = '箱库';
      drawerMeta.textContent = state.sealed.length + ' 个箱子 · 训练词库 = 已封箱的箱子';
      if (!state.sealed.length) {
        drawerBody.innerHTML = '<p class="drawer-empty">还没有封存的箱子。<br>点图里点亮一些词后，按底部「封箱」，箱子会出现在这里。</p>';
        return;
      }
      drawerBody.innerHTML = state.sealed.slice().sort(function (a, b) { return b.boxNo - a.boxNo; }).map(function (box) {
        return '<div class="box-card">' +
          '<div class="box-info"><b>第 ' + box.boxNo + ' 箱</b>' +
          '<span>容量 ' + box.capacity + ' 词 · 实收 ' + box.entries.length + ' 词 · 封存于 ' + fmtDate(box.sealedAt) + '</span></div>' +
          '<div class="box-actions">' +
          '<button class="btn-mini" data-review="' + box.boxNo + '">回看</button>' +
          '<button class="btn-mini primary" data-train="' + box.boxNo + '">训练这箱</button>' +
          '</div></div>';
      }).join('');
    }
  }

  function exportCsv() {
    var rows = allAnnotatedRows();
    if (!rows.length) { toast('还没有标注可导出'); return; }
    function cell(v) {
      var s = String(v == null ? '' : v);
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    var lines = ['word,level,freq_rank,n_pieces,pieces,box,point,annotated_at'];
    rows.forEach(function (r) {
      var w = findWord(r.w);
      lines.push([r.w, w ? w[4] : '', w ? w[5] : '', r.pieces.length, r.pieces.join('|'), r.boxNo, r.p + 1,
        new Date(r.t || Date.now()).toISOString()].map(cell).join(','));
    });
    var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'word-annotations-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('已导出 ' + rows.length + ' 条标注 CSV');
  }

  /* ---------------------------------------------------------------- training */
  function startTraining(boxNo) {
    var box = state.sealed.filter(function (b) { return b.boxNo === boxNo; })[0];
    if (!box || !box.entries.length) { toast('这个箱子还没有词'); return; }
    closeDrawer();
    var rnd = Math.random;
    var words = shuffle(box.entries, rnd).slice(0, 10);
    var qs = words.map(function (e) {
      var w = findWord(e.w);
      var correct = w && w[3] ? w[3] : e.w;
      var opts = [correct], guard = 0;
      while (opts.length < 4 && guard++ < 500) {
        var cand = POOL[Math.floor(rnd() * POOL.length)];
        if (!cand || !cand[3] || cand[3] === correct || cand[0] === e.w) continue;
        if (opts.indexOf(cand[3]) >= 0) continue;
        opts.push(cand[3]);
      }
      opts = shuffle(opts, rnd);
      return { entry: e, word: w, correct: correct, options: opts, answer: opts.indexOf(correct) };
    });
    ui.train = { boxNo: boxNo, qs: qs, idx: 0, correct: 0, answered: false };
    ui.viewSealed = null;
    ui.selected = null; ui.current = null; ui.cuts = []; ui.pinned = null;
    trainView.hidden = false;
    renderTrain();
  }
  function endTrainingUi() {
    ui.train = null;
    trainView.hidden = true;
    renderAll();
  }
  function renderTrain() {
    var t = ui.train;
    if (!t) return;
    var q = t.qs[t.idx];
    $('trainBoxLabel').textContent = '第 ' + t.boxNo + ' 箱';
    $('trainCount').textContent = (t.idx + 1) + ' / ' + t.qs.length;
    $('trainFill').style.width = ((t.idx) / t.qs.length * 100) + '%';
    $('trainCard').hidden = false;
    $('trainEnd').hidden = true;
    $('trainFeedback').hidden = true;
    $('trainLevel').textContent = (q.word && q.word[4] === 'cet6') ? 'CET6 新增' : 'CET4';
    $('trainWord').textContent = q.entry.w;
    $('trainPhon').textContent = q.word && q.word[1] ? '/' + q.word[1] + '/' : '';
    $('trainOptions').innerHTML = q.options.map(function (opt, i) {
      return '<button class="opt" data-i="' + i + '"><span class="opt-key">' + (i + 1) + '</span><span class="opt-text">' + esc(opt) + '</span></button>';
    }).join('');
    t.answered = false;
  }
  function answerTrain(i) {
    var t = ui.train;
    if (!t || t.answered) return;
    var q = t.qs[t.idx];
    var ok = i === q.answer;
    t.answered = true;
    if (ok) t.correct++;
    var opts = $('trainOptions').querySelectorAll('.opt');
    for (var k = 0; k < opts.length; k++) {
      opts[k].disabled = true;
      if (k === q.answer) opts[k].classList.add('correct');
      else if (k === i) opts[k].classList.add('wrong');
      else opts[k].classList.add('dim');
    }
    $('trainVerdict').textContent = ok ? '答对了' : '再记一次';
    $('trainVerdict').className = 'verdict' + (ok ? '' : ' bad');
    $('trainFbWord').textContent = q.entry.w + (q.word && q.word[1] ? '  /' + q.word[1] + '/' : '');
    $('trainFbTrans').textContent = (q.word ? q.word[3] : '') + (q.entry.pieces.length > 1 ? '　·　' + q.entry.pieces.join(' / ') : '');
    $('trainFeedback').hidden = false;
  }
  function nextTrain() {
    var t = ui.train;
    if (!t) return;
    if (t.idx >= t.qs.length - 1) { finishTraining(); return; }
    t.idx++;
    renderTrain();
  }
  function finishTraining() {
    var t = ui.train;
    if (!t) return;
    var score = t.correct, total = t.qs.length;
    var stars = score / total >= 0.9 ? 3 : (score / total >= 0.7 ? 2 : 1);
    $('trainCard').hidden = true;
    $('trainFeedback').hidden = true;
    $('trainEnd').hidden = false;
    $('trainStars').innerHTML = [0, 1, 2].map(function (i) { return '<span class="' + (i < stars ? '' : 'off') + '">★</span>'; }).join('');
    $('trainEndTitle').textContent = '第 ' + t.boxNo + ' 箱 · 练完一轮';
    $('trainEndSub').textContent = '答对 ' + score + ' / ' + total + ' · 词库 = 已封箱的箱子';
    $('trainFill').style.width = '100%';
    $('trainCount').textContent = total + ' / ' + total;
  }

  /* ---------------------------------------------------------------- toast / flash */
  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    if (ui.toastTimer) clearTimeout(ui.toastTimer);
    ui.toastTimer = setTimeout(function () { toastEl.hidden = true; }, ms || 2000);
  }
  function flash(primary, secondary) {
    ui.flash = { primary: primary, secondary: secondary };
    if (ui.flashTimer) clearTimeout(ui.flashTimer);
    ui.flashTimer = setTimeout(function () { ui.flash = null; renderDock(); }, 2800);
  }

  /* ---------------------------------------------------------------- events */
  mapEl.addEventListener('pointermove', function (event) {
    var g = event.target && event.target.closest ? event.target.closest('.pt') : null;
    var i = g ? Number(g.dataset.i) : null;
    if (i === ui.hover) return;
    ui.hover = i;
    renderDock();
  });
  mapEl.addEventListener('pointerleave', function () {
    if (ui.hover == null) return;
    ui.hover = null;
    renderDock();
  });
  mapEl.addEventListener('click', function (event) {
    var g = event.target && event.target.closest ? event.target.closest('.pt') : null;
    if (!g) {
      if (ui.pinned != null) { ui.pinned = null; renderDock(); layoutMap(); }
      return;
    }
    var p = Number(g.dataset.i);
    var occupied = currentViewEntries().some(function (e) { return e.p === p; });
    if (occupied) { pinPoint(p); return; }
    if (ui.viewSealed != null || ui.train || isFull()) return;
    selectPoint(p);
  });

  wordRow.addEventListener('click', function (event) {
    var cut = event.target && event.target.closest ? event.target.closest('.cut') : null;
    if (cut) toggleCut(Number(cut.dataset.c));
  });
  skipBtn.addEventListener('click', skipWord);
  clearBtn.addEventListener('click', clearCuts);
  saveBtn.addEventListener('click', savePlacement);

  dockEl.addEventListener('click', function (event) {
    var btn = event.target && event.target.closest ? event.target.closest('[data-action]') : null;
    if (!btn) return;
    var action = btn.dataset.action;
    if (action === 'seal') sealBox();
    else if (action === 'replace' && ui.pinned != null) startReplace(ui.pinned);
    else if (action === 'extinguish' && ui.pinned != null) extinguish(ui.pinned);
  });

  boxPill.addEventListener('click', function (event) {
    event.stopPropagation();
    closeMenu();
    if (ui.capOpen) closeCapPopover(); else openCapPopover();
  });
  capOptions.addEventListener('click', function (event) {
    var opt = event.target && event.target.closest ? event.target.closest('[data-cap]') : null;
    if (opt) setCapacity(Number(opt.dataset.cap));
  });

  menuBtn.addEventListener('click', function (event) {
    event.stopPropagation();
    if (ui.capOpen) closeCapPopover();
    if (ui.menuOpen) closeMenu(); else openMenu();
  });
  exportBtn.addEventListener('click', exportBackupFile);
  importBtn.addEventListener('click', function () { closeMenu(); importFile.click(); });
  importFile.addEventListener('change', function () {
    var file = importFile.files && importFile.files[0];
    importFile.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed = parseBackup(String(reader.result));
      if (!parsed) { toast('导入失败：不是有效的点图存档'); return; }
      openImportModal(parsed);
    };
    reader.onerror = function () { toast('读取文件失败'); };
    reader.readAsText(file);
  });
  importCancel.addEventListener('click', closeImportModal);
  importMergeBtn.addEventListener('click', function () { applyImport('merge'); });
  importReplaceBtn.addEventListener('click', function () { applyImport('replace'); });
  importModal.addEventListener('click', function (event) { if (event.target === importModal) closeImportModal(); });
  installBtn.addEventListener('click', function () {
    var prompt = ui.installPrompt;
    closeMenu();
    if (!prompt) return;
    prompt.prompt();
    if (prompt.userChoice && prompt.userChoice.then) {
      prompt.userChoice.then(function () { ui.installPrompt = null; installBtn.hidden = true; });
    }
  });
  window.addEventListener('beforeinstallprompt', function (event) {
    event.preventDefault();
    ui.installPrompt = event;
    if (ui.menuOpen) renderMenu();
  });

  document.addEventListener('click', function (event) {
    if (ui.capOpen && !capPopover.contains(event.target) && !boxPill.contains(event.target)) closeCapPopover();
    if (ui.menuOpen && !menuPopover.contains(event.target) && !menuBtn.contains(event.target)) closeMenu();
  });

  annotatedBtn.addEventListener('click', function () { openDrawer('annotated'); });
  boxesBtn.addEventListener('click', function () { openDrawer('boxes'); });
  drawerClose.addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);
  backToCurrent.addEventListener('click', backToCurrentBox);

  drawerBody.addEventListener('click', function (event) {
    var t = event.target;
    if (!t || !t.closest) return;
    if (t.closest('#exportCsv')) { exportCsv(); return; }
    var editBtn = t.closest('[data-edit]');
    if (editBtn) { startSplitEdit(Number(editBtn.dataset.edit)); return; }
    var delBtn = t.closest('[data-del]');
    if (delBtn) { extinguish(Number(delBtn.dataset.del)); renderDrawer(); return; }
    var rev = t.closest('[data-review]');
    if (rev) { openSealed(Number(rev.dataset.review)); return; }
    var tr = t.closest('[data-train]');
    if (tr) { startTraining(Number(tr.dataset.train)); return; }
  });

  $('trainQuit').addEventListener('click', endTrainingUi);
  $('trainBack').addEventListener('click', endTrainingUi);
  $('trainAgain').addEventListener('click', function () { var boxNo = ui.train ? ui.train.boxNo : null; if (boxNo != null) startTraining(boxNo); });
  $('trainNext').addEventListener('click', nextTrain);
  $('trainOptions').addEventListener('click', function (event) {
    var opt = event.target && event.target.closest ? event.target.closest('.opt') : null;
    if (opt) answerTrain(Number(opt.dataset.i));
  });

  document.addEventListener('keydown', function (event) {
    if (ui.train) {
      if (/^[1-4]$/.test(event.key) && !$('trainCard').hidden) answerTrain(Number(event.key) - 1);
      else if (event.key === 'Enter' && !$('trainFeedback').hidden) nextTrain();
      else if (event.key === 'Escape') endTrainingUi();
      return;
    }
    if (event.key === 'Enter' && ui.current) { event.preventDefault(); savePlacement(); return; }
    if ((event.key === 's' || event.key === 'S') && ui.current && !event.ctrlKey && !event.metaKey) { skipWord(); return; }
    if (event.key === 'Escape') {
      if (!importModal.hidden) { closeImportModal(); return; }
      if (ui.menuOpen) { closeMenu(); return; }
      if (ui.capOpen) { closeCapPopover(); return; }
      if (ui.drawer) { closeDrawer(); return; }
      if (ui.pinned != null) { ui.pinned = null; renderDock(); layoutMap(); return; }
      if (ui.current || ui.selected != null || ui.replace || ui.splitEdit) { cancelSelection(); return; }
      return;
    }
    if ((event.ctrlKey || event.metaKey) && (event.key === 'z' || event.key === 'Z')) {
      event.preventDefault();
      undo();
    }
  });

  var resizeQueued = false;
  function onResize() {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(function () {
      resizeQueued = false;
      var mode = isMobileLayout() ? 'scroll' : 'fit';
      if (!state.template || state.template.mode !== mode) renderAll();
      else layoutMap();
    });
  }
  window.addEventListener('resize', onResize);
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(stageEl);

  /* ---------------------------------------------------------------- init */
  function init() {
    renderAll();
    window.__PROTO_READY = true;
  }
  init();

  /* 调试 / 截图接口 */
  window.__proto = {
    get state() { return state; },
    ui: ui,
    selectPoint: selectPoint,
    savePlacement: savePlacement,
    skipWord: skipWord,
    toggleCut: toggleCut,
    sealBox: sealBox,
    undo: undo,
    entryAt: entryAt,
    openDrawer: openDrawer,
    startTraining: startTraining,
    setCapacity: setCapacity,
    exportJson: function () { return exportJsonString(); },
    importJson: function (text, mode) {
      var parsed = parseBackup(typeof text === 'string' ? text : JSON.stringify(text));
      if (!parsed) return null;
      if (mode === 'replace') { replaceImport(parsed.state); return { mode: 'replace', words: countWords(state) }; }
      return mergeImport(parsed.state);
    },
    backupSummary: function () { return { words: countWords(state), sealed: state.sealed.length, entries: state.entries.length }; },
    demoFill: function (n) {
      for (var k = 0; k < n; k++) {
        if (state.entries.length >= state.capacity) break;
        if (!ui.current) loadNextWord();
        if (!ui.current) break;
        var free = -1, used = {};
        state.entries.forEach(function (e) { used[e.p] = 1; });
        for (var i = 0; i < MAP_POINTS; i++) { if (!used[i]) { free = i; break; } }
        if (free < 0) break;
        var w = ui.current[0];
        var pieces = [w];
        if (w.length >= 5 && Math.random() < 0.75) {
          var cut = Math.floor(w.length / 2) + (Math.random() < 0.5 ? 0 : 1);
          if (cut > 0 && cut < w.length) pieces = [w.slice(0, cut), w.slice(cut)];
        }
        state.entries.push({ p: free, w: w, pieces: pieces, t: Date.now() });
        state.pointer = ui.currentIndex + 1;
        ui.current = null;
      }
      ui.selected = null; ui.cuts = []; ui.pinned = null; ui.hover = null; ui.flash = null;
      saveState(); renderAll();
    },
    pointIndexAwayFromCard: function () {
      var W = stageW, H = stageH;
      for (var i = 0; i < state.template.points.length; i++) {
        var x = state.template.points[i][0] * W, y = state.template.points[i][1] * H;
        if (x < W * 0.26 && y > H * 0.3 && y < H * 0.7) return i;
      }
      return 0;
    },
  };
})();
